<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>التحقق من الشهادات</title>
</head>
<body>
  <p id="message">جاري تحويلك إلى صفحة التحقق من الشهادة...</p>
  <script>
  (function () {
    "use strict";
    const params = new URLSearchParams(location.search);
    const segments = location.pathname.split("/").filter(Boolean);
    const last = segments[segments.length - 1] || "";
    const reserved = ["view", "index.html", "404.html"];
    const id = (params.get("id") || (!reserved.includes(last) ? last : "")).trim();

    if (!id) {
      document.getElementById("message").textContent =
        "رابط التحقق غير مكتمل: رقم الشهادة غير موجود.";
      return;
    }

    const target = new URL("https://services-balady-ss.blog/view/" + encodeURIComponent(id));
    ["type", "ref", "num"].forEach(function (key) {
      const value = params.get(key);
      if (value !== null && value !== "") target.searchParams.set(key, value);
    });

    location.replace(target.toString());
  })();
  </script>
</body>
</html>
